<!doctype html><html><head><meta charset="UTF-8"><style>html,body{margin:0;width:100%;height:100%;background:#080e10}canvas{display:block;width:100%;height:100%}#label{position:absolute;top:20px;left:24px;color:#ddd;font:16px sans-serif}</style></head><body><div id="label"></div><canvas id="view"></canvas><script type="module">
import {createMapViewer} from '/src/client/mapViewer.ts';
const name=new URLSearchParams(location.search).get('map')||'before';
const map=await fetch('/output/water-qa/'+name+'.json').then(r=>r.json());
document.querySelector('#label').textContent=map.name;
const viewer=await createMapViewer({canvas:document.querySelector('canvas'),map,pixelRatio:1,autoStart:false});
viewer.setSize(innerWidth,innerHeight); viewer.camera.position.set(-75,58,92);viewer.camera.lookAt(0,2,0);viewer.camera.updateProjectionMatrix();
viewer.tick(0);window.viewer=viewer;window.ready=true;
window.step=(dt=0.5)=>viewer.tick(dt);
</script></body></html>
