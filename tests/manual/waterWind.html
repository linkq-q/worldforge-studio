<!doctype html>
<html><head><meta charset="utf-8"><title>Lake wind GPU regression</title></head>
<body><pre id="output">Running...</pre><script type="module">
import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer();
const surface=new WaterSurface(new THREE.Scene(),renderer,new THREE.Group(),{size:1,segments:1});
const source=surface.material.fragmentShader;
const start=source.indexOf('      float detailStrength = uWaterNormalStrength;');
if(start<0)throw Error('Lake wind modulation is missing');
const block=source.slice(start,source.indexOf('      finalWaterNormal =',start));
const target=new THREE.WebGLRenderTarget(64,64);
const material=new THREE.ShaderMaterial({
  uniforms:{hasTerrainDepth:{value:true},uUseSceneWaterLight:{value:true},uWaterMode:{value:1},flowingDetail:{value:false},uTime:{value:0},uWaterNormalSpeedA:{value:-0.014},uWaterNormalStrength:{value:0.8}},
  vertexShader:'void main(){gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:`${NOISE_UTILS_GLSL}
    uniform bool hasTerrainDepth,uUseSceneWaterLight,flowingDetail;
    uniform float uWaterMode,uTime,uWaterNormalSpeedA,uWaterNormalStrength;
    void main(){vec2 waterUv=gl_FragCoord.xy-32.0;vec2 dirA=normalize(vec2(1.0,0.25));
      ${block}

    }`
});
