<!doctype html>
<html><head><meta charset="utf-8"><title>Water flow GPU regression</title></head>
<body><pre id="output">Running...</pre><script type="module">
import * as THREE from 'three';
import { WaterSurface } from '/vendor/voxel-render-runtime/src/environment/water/WaterSurface.js';

// Exercise the actual material helper on the GPU, with two independent slope
// directions. At a 50/50 blend the previous implementation lost 29% amplitude.
const renderer = new THREE.WebGLRenderer();
const sourceSurface = new WaterSurface(new THREE.Scene(), renderer, new THREE.Group(), {size:1,segments:1});
const source = sourceSurface.material.fragmentShader;
const start = source.indexOf('vec3 blendWaterFlowNormals(');
if (start < 0) throw new Error('Water flow variance-preserving blend is missing');
const helper = source.slice(start, source.indexOf('\n  }', start) + 4);
const target = new THREE.WebGLRenderTarget(9,1);
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const scene = new THREE.Scene();
const material = new THREE.ShaderMaterial({
  uniforms: { legacy: {value:false} },
  vertexShader: 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader: `uniform bool legacy; ${helper}
    void main(){
      float weight=(gl_FragCoord.x-0.5)/8.0;
      vec3 a=normalize(vec3(0.2,0.0,1.0)), b=normalize(vec3(0.0,0.2,1.0));
      vec3 n=legacy?normalize(mix(a,b,weight)):blendWaterFlowNormals(a,b,weight);
      gl_FragColor=vec4(n*0.5+0.5,1.0);
    }`
});
const geometry = new THREE.PlaneGeometry(2,2);
scene.add(new THREE.Mesh(geometry,material));
function sample(legacy){
  material.uniforms.legacy.value=legacy;
  renderer.setRenderTarget(target);renderer.render(scene,camera);
  const pixels=new Uint8Array(9*4);renderer.readRenderTargetPixels(target,0,0,9,1,pixels);
  return Array.from({length:9},(_,i)=>{
    const x=pixels[i*4]/255*2-1,y=pixels[i*4+1]/255*2-1,z=pixels[i*4+2]/255*2-1;
    return Math.hypot(x,y)/z;
  });
}
const previous=sample(true),current=sample(false);
const passed=current.every(s=>s>0.19&&s<0.21)&&previous[4]<0.16;
window.result={passed,previous,current};
document.querySelector('#output').textContent=JSON.stringify(window.result,null,2);
sourceSurface.dispose();geometry.dispose();material.dispose();target.dispose();renderer.dispose();
if(!passed)throw new Error('Water flow slope amplitude changes during crossfade');
</script></body></html>
