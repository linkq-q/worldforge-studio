<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Scene Art GPU verification</title>
<style>body{margin:0;background:#15212c;color:#eee;font:15px system-ui}header{padding:12px}button{margin:0 8px 8px 0;padding:8px}canvas{width:100vw;height:76vh;display:block}pre{margin:12px;white-space:pre-wrap}</style>
<header>场景美术能力 · 同一运行时 GPU 验证<br><button id="before">基线</button><button id="after">区域配色与局部效果</button><button id="cel">Cel 与局部效果</button><button id="restore">切换恢复验证</button></header>
<canvas id="view"></canvas><pre id="status">加载中</pre>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { createMapViewer } from '/src/client/mapViewer.ts';
import { createEmptyMap, createMapObject } from '/src/shared/map.ts';
import { applyMapOperations } from '/src/shared/mapOperations.ts';
import { createRenderScheme } from '/src/shared/renderScheme.ts';
import { normalizeRenderPlan } from '/src/shared/renderPlan.ts';
const status = document.querySelector('#status');
const errors=[];
window.addEventListener('error',event=>{errors.push(event.message);status.textContent=JSON.stringify({errors});});
window.addEventListener('unhandledrejection',event=>{errors.push(String(event.reason));status.textContent=JSON.stringify({errors});});
let map=createEmptyMap('Scene Art GPU', 'scene-art-gpu', [20,5,20]);
map=applyMapOperations(map,[{type:'grass.layer.add',layer:{id:'lawn',preset:'meadow'}},{type:'grass.fill',layerId:'lawn',density:0.6}]);
map.visualSemantics.zones=[{id:'street',center:[0,3],radius:5,tags:['paving'],material:'asphalt',intensity:1,region:{kind:'polygon',points:[[-9,0],[9,0],[9,7],[-9,7]]}}];
const asset=(id,nodes)=>({id,name:id,prompt:id,modelJson:{nodes},colliderPlan:{version:1,boxes:[],sourceMeshCount:nodes.length,candidateCount:0,fallbackUsed:false},mode:'voxel',createdAt:1,updatedAt:1});
map.assets=[asset('box',[{id:'body',mesh:{type:'box',params:{width:1.5,height:2.5,depth:1.5},color:'#b7c4ca'}}]),asset('lamp',[{id:'body',mesh:{type:'box',params:{width:0.2,height:3.5,depth:0.2},color:'#4c5e71'}},{id:'bulb',transform:{pos:[0,1.7,0]},mesh:{type:'box',params:{width:0.8,height:0.25,depth:0.8},color:'#ffd184'}}])];
map.objects=[[-5,-2],[-2,-2],[1,-2],[4,-2]].map(([x,z],i)=>({...createMapObject('柱体','box'),id:'pillar-'+i,heightMode:'fixed',transform:{position:[x,1.25,z],rotation:[0,0,0],scale:[1,1,1],size:[1.5,2.5,1.5]}}));
map.objects.push({...createMapObject('路灯','lamp'),id:'lamp',heightMode:'fixed',transform:{position:[-4,1.75,3],rotation:[0,0,0],scale:[1,1,1],size:[1,3.5,1]}});
map.assets.push(asset('glass',[{id:'window',tags:[{tag:'base',value:'glass'}],mesh:{type:'box',params:{width:2,height:2.5,depth:0.15},color:'#b3d7d5'}}]));
for(const [i,x] of [5,8].entries())map.objects.push({...createMapObject('玻璃','glass'),id:'glass-'+i,heightMode:'fixed',transform:{position:[x,1.25,3],rotation:[0,0,0],scale:[1,1,1],size:[2,2.5,0.15]}});
const modules=[{id:'lighting.sun',params:{color:'#91adcb',intensity:0.65}},{id:'lighting.hemisphere',params:{intensity:0.45,skyColor:'#879caf',groundColor:'#32363e'}},{id:'runtime.post-quality',params:{bloom:'soft',bloomStrength:0.12,ssao:'soft'}},{id:'runtime.grass-style',params:{rootColor:'#345444',tipColor:'#739571'}}];
const rule=(id,key,config)=>({id,key,params:{config:JSON.stringify(config)}});
const extra=[
 rule('runtime.color-field','meadow',{axis:'x',start:-10,end:10,stops:[[0,'#345c75'],[0.55,'#619278'],[1,'#b6ac62']],strength:0.9}),
 rule('runtime.local-light','lamp',{objectId:'lamp',color:'#ffc77f',intensity:12,range:12,offset:[0,1.5,0]}),
 rule('runtime.surface-detail','pillar',{objectId:'pillar-1',roughness:0.2,colorExpression:'mix(color, vec3(0.15, 0.7, 0.85), 0.8)',emissionExpression:'vec3(0.06, 0.2, 0.3) * (0.8 + 0.2 * sin(time))'}),
 rule('runtime.wet-surface','street',{zoneId:'street',strength:0.55,distortion:0.002}),
 rule('runtime.surface-detail','window',{objectId:'glass-0',partId:'window',transmission:0.92,roughness:0.08})
];
const scheme=(active,cel=false)=>createRenderScheme({name:'QA only',settings:{background:'#15212c',fogDensity:0,exposure:0.95},renderPlan:normalizeRenderPlan({version:2,baseSchemeId:'render-indoor-neutral',modules:[...modules,...(active?extra:[]),...(cel?[{id:'runtime.surface-style',params:{mode:'cel',bands:3}}]:[])]})});
const viewer=await createMapViewer({canvas:document.querySelector('#view'),map,scheme:scheme(false),autoStart:false});
viewer.camera.position.set(17,14,22);viewer.camera.lookAt(0,0,0);viewer.setSize(innerWidth,innerHeight*0.76);
viewer.renderer.debug.onShaderError=(gl,program,vertex,fragment)=>{errors.push([gl.getProgramInfoLog(program),gl.getShaderInfoLog(vertex),gl.getShaderInfoLog(fragment)].join('\n'));};
let mode='before',frames=0;
function report(){status.textContent=JSON.stringify({mode,errors,frames,lights:viewer.runtime.rendered.group.getObjectByName('mapLocalLights')?.children.filter(x=>x.isPointLight).length,drawCalls:viewer.renderer.info.render.calls,shaderMaterials:viewer.runtime.rendered.modelsRoot.children.length});}
function apply(active,cel=false){try{viewer.setRenderScheme(scheme(active,cel));mode=active?(cel?'cel':'after'):'before';report();}catch(error){errors.push(String(error));report();}}
document.querySelector('#before').onclick=()=>apply(false);
document.querySelector('#after').onclick=()=>apply(true);
document.querySelector('#cel').onclick=()=>apply(true,true);
document.querySelector('#restore').onclick=()=>{apply(true);apply(false);apply(true);apply(false);mode='restored';report();};
function loop(){viewer.tick(1/60);frames++;if(frames%30===0)report();requestAnimationFrame(loop);}loop();
</script></html>
