<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldForge 地形对比</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111b22; color: #e8eee9; font: 15px system-ui, sans-serif; }
  header { padding: 24px 28px 12px; }
  h1 { margin: 0 0 10px; font-size: 24px; }
  p { color: #b8c7c6; line-height: 1.6; }
  form { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  input { width: 76px; padding: 6px; }
  button { padding: 8px 16px; cursor: pointer; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 20px; gap: 12px; }
  article { background: #1b2931; border: 1px solid #34434b; border-radius: 10px; overflow: hidden; }
  h2 { font-size: 18px; margin: 16px; }
  canvas { display: block; width: 100%; height: 44vh; }
  .stats, article p { margin: 14px 16px; font-size: 13px; }
  footer { padding: 0 28px 20px; color: #b8c7c6; }
  #error { color: #ffac98; white-space: pre-wrap; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } canvas { height: 380px; } }
</style>
<header>
  <h1>地形修型：从山脊到村庄尺度的缓坡</h1>
  <p>同一尺寸、种子、网格、镜头与编辑器光照。拖动任意视图可同步旋转；滚轮缩放。此页只在内存中预览，不保存地图。</p>
  <form id="controls">
    <label>种子 <input id="seed" type="number" value="42" min="0" max="4294967295"></label>
    <label>地图宽度 <select id="map-size"><option value="96">96 米（村庄）</option><option value="192">192 米（山地）</option></select></label>
    <label>高度 <input id="amplitude" type="number" value="8" min="1" max="63"></label>
    <label>冲刷强度 <input id="drainage" type="number" value="0.55" min="0" max="1" step="0.05"></label>
    <label>迭代 <input id="iterations" type="number" value="8" min="1" max="12"></label>
    <button>重新生成</button>
  </form>
  <div id="error" role="alert"></div>
</header>
<main>
  <article><h2>① 原有丘陵</h2><canvas></canvas><div class="stats"></div><p>多层平滑噪声。增加高度，仍以圆缓起伏为主。</p></article>
  <article><h2>② 宽脊山体</h2><canvas></canvas><div class="stats"></div><p>圆滑峰顶并减少高频尖脊，保留连贯起伏。</p></article>
  <article><h2>③ 山脉 + 排水刻蚀</h2><canvas></canvas><div class="stats"></div><p>沿最陡坡汇流，按集水面积逐步下切；辅以碎石下滑。</p></article>
  <article><h2>④ 局部平滑 + 缓坡通道</h2><canvas></canvas><div class="stats"></div><p>AI 可用的平滑画笔和坡道操作：压低局部尖峰，沿道路形成可控坡度。</p></article>
</main>
<footer>使用项目真实 MapViewer；村庄模式为 96 × 96 米、65 × 65 高度网格。此页只做内存预览，不覆盖现有地图。</footer>
<script type="module">
  import { createEmptyMap } from '/src/shared/map.ts';
  import { applyMapOperations } from '/src/shared/mapOperations.ts';
  import { createMapViewer } from '/src/client/mapViewer.ts';
  const viewers = [];
  let yaw = 0.65, pitch = 0.72, distance = 170;
  const canvases = [...document.querySelectorAll('canvas')];
  function render() {
    for (const viewer of viewers) {
      const canvas = viewer.renderer.domElement;
      viewer.setSize(canvas.clientWidth, canvas.clientHeight);
      const targetHeight = Number(document.querySelector('#map-size').value) === 96 ? 3 : 12;
      viewer.camera.position.set(Math.sin(yaw) * Math.cos(pitch) * distance, targetHeight + Math.sin(pitch) * distance, Math.cos(yaw) * Math.cos(pitch) * distance);
      viewer.camera.lookAt(0, targetHeight, 0);
      viewer.camera.far = 2000;
      viewer.camera.updateProjectionMatrix();
      viewer.tick(0);
    }
  }
  async function generate(event) {
    event?.preventDefault();
    const button = document.querySelector('button');
    button.disabled = true;
    window.terrainStudyReady = false;
    document.querySelector('#error').textContent = '';
    try {
      const options = { seed: Number(document.querySelector('#seed').value), amplitude: Number(document.querySelector('#amplitude').value), roughness: 0.65, direction: 25 };
      const refinement = { type: 'terrain.refine', drainage: Number(document.querySelector('#drainage').value), iterations: Number(document.querySelector('#iterations').value), erosion: 0.3, talus: 38 };
      const stats = [];
      const size = Number(document.querySelector('#map-size').value);
      for (let i = 0; i < 4; i++) {
        const base = createEmptyMap('terrain study', 'terrain-study', [size, size === 96 ? 16 : 64, size]);
        const start = performance.now();
        const operations = [{ type: 'terrain.generate', preset: i === 0 ? 'hills' : 'mountains', ...options }, ...(i >= 2 ? [refinement] : [])];
        let map = applyMapOperations(base, operations);
        if (i === 3) {
          const width = map.terrain.resolutionX;
          const candidates = map.terrain.heights.map((height, index) => ({ height, x: index % width, z: Math.floor(index / width) }))
            .filter(point => point.x > width * 0.3 && point.x < width * 0.7 && point.z > width * 0.3 && point.z < width * 0.7);
          const peak = candidates.reduce((best, point) => point.height > best.height ? point : best);
          const x = peak.x / (width - 1) * size - size / 2;
          const z = peak.z / (width - 1) * size - size / 2;
          map = applyMapOperations(map, [
            { type: 'terrain.brush', mode: 'smooth', point: [x, 0, z], size: size * 0.14, strength: 1 },
            { type: 'terrain.ramp', start: [-size * 0.26, 0], end: [size * 0.26, 0], width: size * 0.08, softness: 0.8 }
          ]);
        }
        const elapsed = performance.now() - start;
        const heights = map.terrain.heights;
        const min = Math.min(...heights), max = Math.max(...heights);
        stats.push({ min, max, milliseconds: elapsed, resolution: map.terrain.resolutionX });
        document.querySelectorAll('.stats')[i].textContent = `高度 ${min.toFixed(1)}–${max.toFixed(1)} m · 地形计算 ${elapsed.toFixed(0)} ms`;
        if (viewers[i]) await viewers[i].setMap(map);
        else viewers.push(await createMapViewer({ canvas: canvases[i], map, scheme: null, pixelRatio: 1, autoStart: false }));
      }
      render();
      window.terrainStudyStats = stats;
      window.terrainStudyReady = true;
    } catch (error) {
      document.querySelector('#error').textContent = String(error.stack ?? error);
    } finally { button.disabled = false; }
  }
  for (const canvas of canvases) {
    let drag;
    canvas.onpointerdown = (event) => { drag = [event.clientX, event.clientY]; canvas.setPointerCapture(event.pointerId); };
    canvas.onpointermove = (event) => {
      if (!drag) return;
      yaw -= (event.clientX - drag[0]) * 0.008;
      pitch = Math.max(0.15, Math.min(1.5, pitch + (event.clientY - drag[1]) * 0.006));
      drag = [event.clientX, event.clientY]; render();
    };
    canvas.onpointerup = canvas.onpointercancel = () => { drag = undefined; };
    canvas.addEventListener('wheel', (event) => { event.preventDefault(); distance = Math.max(50, Math.min(700, distance * Math.exp(event.deltaY * 0.001))); render(); }, { passive: false });
  }
  document.querySelector('#map-size').addEventListener('change', (event) => {
    const village = event.target.value === '96';
    document.querySelector('#amplitude').value = village ? '8' : '48';
    distance = village ? 170 : 340;
    generate();
  });
  window.addEventListener('resize', render);
  document.querySelector('form').addEventListener('submit', generate);
  await generate();
</script>
</html>
