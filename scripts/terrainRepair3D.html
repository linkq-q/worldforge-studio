<header><div class="wrap"><small>WORLD FORGE / ACTUAL MAP RENDERER</small><h1>在三维地图里看修复前后</h1><p>左右使用项目的 MapViewer 和同一镜头。拖动画面旋转，滚轮缩放；操作任一侧，另一侧同步。</p></div></header>

<script type="module">
  import { createMapViewer } from '/src/client/mapViewer.ts';
  import { createEmptyMap } from '/src/shared/map.ts';
  import { applyMapOperations } from '/src/shared/mapOperations.ts';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

  const payload = JSON.parse(document.getElementById('terrain-data').textContent);
  const $ = id => document.getElementById(id);
  const state = { kind: 'river', stage: 0 };
  const caseKeys = ['river', 'lake', 'mountain', 'cone'];
  const notes = [
    '河湖接岸：重点观察河道与湖盆边缘是否仍像陡直台阶。山脉和圆锥没有水体，此阶段画面不应变化。',
    '网格加密：观察曲线边缘和局部细节。这里是在新网格上重算地形，不代表单次插值可以创造细节。',
    '排水分流：在山脉和对称圆锥上观察沟谷方向及十字纹。河湖雕刻本身在此阶段保持不变。'
  ];
  function decode(encoded) {
    const binary = atob(encoded), heights = [];
    for (let i = 0; i < binary.length; i += 2) heights.push(((binary.charCodeAt(i) | binary.charCodeAt(i + 1) << 8) / 100) - 16);
    return heights;
  }
  function mapAt(kind, index) {
    const entry = payload.data[kind][index];
    const empty = createEmptyMap(payload.cases[kind].name, `terrain-repair-${kind}-${index}`, [96, 48, 96]);
    const terrain = { ...empty.terrain, resolutionX: entry.n, resolutionZ: entry.n, heights: decode(entry.heights) };
    const operations = [];
    if (payload.cases[kind].water) operations.push({ type: 'water.add', water: payload.cases[kind].water });
    operations.push({ type: 'terrain.set', terrain });
    return applyMapOperations(empty, operations);
  }
  for (const kind of caseKeys) {
    const button = document.createElement('button'); button.textContent = payload.cases[kind].name; button.dataset.kind = kind;
    button.addEventListener('click', () => { state.kind = kind; void show(); }); $('cases').append(button);
  }
  payload.stages.slice(1).forEach((stage, index) => {
    const button = document.createElement('button'); button.textContent = stage.name; button.dataset.stage = index;
    button.addEventListener('click', () => { state.stage = index; void show(); }); $('stages').append(button);
  });

  let viewers, controls, loading = false;
  function frame(detail) {
    if (!controls) return;
    controls[0].target.set(0, state.kind === 'mountain' ? 10 : 6, 0);
    viewers[0].camera.position.set(...(detail ? [43, 40, 53] : [86, 78, 102]));
    controls[0].update();
    sync(0, 1);
  }
  $('fit-view').addEventListener('click', () => frame(false));
  $('detail-view').addEventListener('click', () => frame(true));
  function sync(from, to) {
    viewers[to].camera.position.copy(viewers[from].camera.position);
    viewers[to].camera.quaternion.copy(viewers[from].camera.quaternion);
    viewers[to].camera.up.copy(viewers[from].camera.up);
    controls[to].target.copy(controls[from].target);
    viewers[0].tick(0); viewers[1].tick(0);
  }
  async function show() {
    if (loading) return;
    loading = true;
    document.querySelectorAll('.tabs button').forEach(button => { button.disabled = true; });
    $('status').textContent = '正在重建地图…';
    try {
      const maps = [mapAt(state.kind, state.stage), mapAt(state.kind, state.stage + 1)];
      if (!viewers) {
        viewers = await Promise.all(['before', 'after'].map((id, index) => createMapViewer({ canvas: $(id), map: maps[index], scheme: null, autoStart: false, pixelRatio: 1 })));
        controls = viewers.map((viewer, index) => {
          viewer.camera.position.set(86, 78, 102);
          const orbit = new OrbitControls(viewer.camera, $(index ? 'after' : 'before'));
          orbit.target.set(0, 8, 0); orbit.maxPolarAngle = Math.PI * .49; orbit.update();
          orbit.addEventListener('change', () => sync(index, 1 - index));
          new ResizeObserver(() => { viewer.setSize($(index ? 'after' : 'before').clientWidth, $(index ? 'after' : 'before').clientHeight); viewer.tick(0); }).observe($(index ? 'after' : 'before'));
          return orbit;
        });
        sync(0, 1);
      } else {
        await Promise.all(viewers.map((viewer, index) => viewer.setMap(maps[index])));
        sync(0, 1);
      }
      for (const [side, index] of [['before', state.stage], ['after', state.stage + 1]]) {
        const stage = payload.stages[index], entry = payload.data[state.kind][index];
        $(side + '-title').textContent = (side === 'before' ? '修复前 · ' : '修复后 · ') + stage.name;
        $(side + '-commit').textContent = stage.commit;
        $(side + '-foot').textContent = `${entry.n} × ${entry.n} 格点 · ${entry.spacing.toFixed(2)} 米格距 · ${entry.metricLabel} ${entry.metric.toFixed(3)} 米`;
      }
      $('description').textContent = payload.cases[state.kind].description + ' ' + notes[state.stage];
      document.querySelectorAll('#cases button').forEach(button => button.classList.toggle('active', button.dataset.kind === state.kind));
      document.querySelectorAll('#stages button').forEach(button => button.classList.toggle('active', Number(button.dataset.stage) === state.stage));
      $('status').textContent = '三维地图已加载。左右镜头同步，可以拖动和缩放。';
    } catch (error) {
      $('status').textContent = `地图渲染失败：${error?.stack ?? error}`;
      console.error(error);
    } finally {
      loading = false;
      document.querySelectorAll('.tabs button').forEach(button => { button.disabled = false; });
    }
  }
  void show();
</script>
