<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #error { position: fixed; color: #fff; top: 1em; left: 1em; background: #802; padding: 1em; display: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas><pre id="error"></pre>
  <script type="module">
    import { createMapViewer } from '/src/client/mapViewer.ts';
    const params = new URLSearchParams(location.search);
    try {
      const id = params.get('map');
      if (!id || !/^map-[a-z0-9-]+$/.test(id)) throw new Error('Invalid map id');
      const response = await fetch(`http://127.0.0.1:8797/api/editor/maps/${id}`);
      if (!response.ok) throw new Error(`Map HTTP ${response.status}`);
      const { map } = await response.json();
      const viewer = await createMapViewer({ canvas: document.querySelector('canvas'), map, scheme: null, autoStart: false, pixelRatio: 1 });
      const [width, height, depth] = map.box.size;
      const side = params.get('view') === 'side';
      viewer.setSize(innerWidth, innerHeight);
      viewer.camera.position.set(side ? 0 : width * 0.52, side ? height * 0.55 : height * 1.65, side ? depth * 0.85 : depth * 0.72);
      viewer.camera.lookAt(0, height * 0.16, 0);
      viewer.camera.near = 0.1;
      viewer.camera.far = Math.max(width, depth) * 6;
      viewer.camera.updateProjectionMatrix();
      viewer.tick(0);
      window.apiAblationReady = true;
    } catch (error) {
      const panel = document.querySelector('#error');
      panel.style.display = 'block';
      panel.textContent = String(error?.stack ?? error);
      window.apiAblationError = String(error?.stack ?? error);
    }
  </script>
</body>
</html>
