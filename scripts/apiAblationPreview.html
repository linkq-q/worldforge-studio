<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #error { position: fixed; color: #fff; top: 1em; left: 1em; background: #802; padding: 1em; display: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas><pre id="error"></pre>
  <script type="module">
    import { createMapViewer } from '/src/client/mapViewer.ts';
    const params = new URLSearchParams(location.search);
    try {
      const id = params.get('map');
      if (!id || !/^map-[a-z0-9-]+$/.test(id)) throw new Error('Invalid map id');
      const response = await fetch(`http://127.0.0.1:8797/api/editor/maps/${id}`);
      if (!response.ok) throw new Error(`Map HTTP ${response.status}`);
      const { map } = await response.json();
      const viewer = await createMapViewer({ canvas: document.querySelector('canvas'), map, scheme: null, autoStart: false, pixelRatio: 1 });
      const [width, height, depth] = map.box.size;
      const landmark = params.get('framing') === 'landmark';
      const study = params.get('framing') === 'study';
      const targetY = landmark ? 22 : height * 0.5;
      const halfWidth = landmark ? 40 : width * 0.5;
      const halfDepth = landmark ? 40 : depth * 0.5;
      const radius = Math.hypot(halfWidth, halfDepth, landmark ? 22 : height * 1.5);
      const top = params.get('view') === 'top';
      viewer.setSize(innerWidth, innerHeight);
      if (top) {
        const distance = Math.max(width / viewer.camera.aspect, depth) * 0.5 / Math.tan(viewer.camera.fov * Math.PI / 360) * 1.14;
        viewer.camera.up.set(0, 0, -1);
        viewer.camera.position.set(0, targetY + distance, 0);
      } else {
        let distance = radius / Math.sin(viewer.camera.fov * Math.PI / 360);
        if (study) {
          // Fit the same map-size envelope for every condition, preserving a 45-degree view.
          const tan = Math.tan(viewer.camera.fov * Math.PI / 360);
          distance = 0;
          for (const x of [-width / 2, width / 2]) for (const y of [-6, height]) for (const z of [-depth / 2, depth / 2]) {
            const dy = y - targetY;
            const cameraX = (x - z) * Math.SQRT1_2;
            const cameraY = -(x + z) / 2 + dy * Math.SQRT1_2;
            const towardCamera = (x + z) / 2 + dy * Math.SQRT1_2;
            distance = Math.max(distance, towardCamera + Math.abs(cameraX) / (tan * viewer.camera.aspect), towardCamera + Math.abs(cameraY) / tan);
          }
          distance *= 1.08;
        }
        viewer.camera.up.set(0, 1, 0);
        viewer.camera.position.set(distance * 0.5, targetY + distance * Math.SQRT1_2, distance * 0.5);
      }
      viewer.camera.lookAt(0, targetY, 0);
      viewer.camera.near = 0.1;
      viewer.camera.far = Math.max(width, depth) * 8;
      viewer.camera.updateProjectionMatrix();
      viewer.tick(0);
      window.apiAblationReady = true;
    } catch (error) {
      const panel = document.querySelector('#error');
      panel.style.display = 'block';
      panel.textContent = String(error?.stack ?? error);
      window.apiAblationError = String(error?.stack ?? error);
    }
  </script>
</body>
</html>
