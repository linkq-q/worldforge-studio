<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldForge 可旋转地形实验总览</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #111923; color: #e7edf2; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: minmax(260px, 330px) 1fr; height: 100vh; }
    aside { overflow: auto; border-right: 1px solid #33404c; padding: 20px; }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { margin: 0 0 14px; color: #aab7c2; }
    input { width: 100%; background: #17232e; color: inherit; border: 1px solid #405262; border-radius: 7px; padding: 9px; margin: 5px 0 12px; }
    #count { color: #8dbfae; margin-bottom: 10px; }
    #list { display: grid; gap: 6px; }
    button { width: 100%; text-align: left; background: #1b2935; color: inherit; border: 1px solid transparent; border-radius: 7px; padding: 9px 10px; cursor: pointer; }
    button:hover, button[aria-current="true"] { border-color: #70b9a3; background: #213d40; }
    button small { display: block; color: #9cabb6; }
    main { display: flex; flex-direction: column; min-width: 0; }
    header { display: flex; gap: 10px; align-items: center; padding: 9px 15px; background: #16222d; border-bottom: 1px solid #33404c; }
    #title { flex: 1; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    a { color: #8bd2bc; white-space: nowrap; }
    iframe { border: 0; flex: 1; width: 100%; background: #0b1117; }
    .note { padding: 7px 15px; color: #aab7c2; border-top: 1px solid #33404c; }
    @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 30vh 70vh; } aside { border-right: 0; border-bottom: 1px solid #33404c; } }
  </style>
</head>
<body>
  <aside>
    <h1>可旋转地形实验总览</h1>
    <p>逐张载入 WorldForge 原编辑器；在右侧按住右键拖动（或 Alt + 左键拖动）旋转、滚轮缩放。所有当前地图库中保存的 500 米连续地形测试都会列出，首出和本地重放都保留。</p>
    <label for="search">查找地图</label>
    <input id="search" type="search" placeholder="名称或 map ID">
    <div id="count">正在读取地图…</div>
    <div id="list"></div>
  </aside>
  <main>
    <header><span id="title">选择一张地图</span><a id="open" target="_blank" rel="noopener">在原编辑器中打开 ↗</a></header>
    <iframe id="viewer" title="WorldForge 原编辑器交互预览" allow="fullscreen; pointer-lock"></iframe>
    <div class="note">此页只切换原编辑器的地图 ID，不重绘地形，也不修改保存的规划。</div>
  </main>
  <script>
    const base = 'http://127.0.0.1:8818';
    const cutoff = Date.parse('2026-09-29T00:00:00+08:00');
    const list = document.querySelector('#list');
    const viewer = document.querySelector('#viewer');
    const search = document.querySelector('#search');
    let maps = [], selected = null;
    function show(map) {
      selected = map.id;
      const url = `${base}/?map=${encodeURIComponent(map.id)}`;
      viewer.src = url;
      document.querySelector('#title').textContent = map.name;
      document.querySelector('#open').href = url;
      history.replaceState(null, '', `#${map.id}`);
      render();
    }
    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = maps.filter(map => `${map.id} ${map.name}`.toLowerCase().includes(query));
      document.querySelector('#count').textContent = `${visible.length} / ${maps.length} 张可交互地图`;
      list.replaceChildren(...visible.map(map => {
        const button = document.createElement('button');
        button.setAttribute('aria-current', String(map.id === selected));
        button.textContent = map.name;
        const small = document.createElement('small');
        small.textContent = `${map.id} · ${Math.round(map.width)} m`;
        button.append(small);
        button.onclick = () => show(map);
        return button;
      }));
    }
    search.oninput = render;
    fetch(`${base}/api/editor/maps`).then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then(data => {
      maps = data.maps.filter(map => map.width >= 500 && map.depth >= 500 && map.updatedAt >= cutoff)
        .sort((a, b) => b.updatedAt - a.updatedAt);
      const requested = decodeURIComponent(location.hash.slice(1));
      const first = maps.find(map => map.id === requested) ?? maps[0];
      if (first) show(first); else render();
    }).catch(error => {
      document.querySelector('#count').textContent = `无法读取 ${base} 的地图列表：${error.message}`;
    });
  </script>
</body>
</html>
